name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release tag and commit
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the stable semantic version format 1.2.3."
            exit 1
          fi

          default_branch="${{ github.event.repository.default_branch }}"
          git fetch --no-tags origin "$default_branch"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$default_branch"; then
            echo "The tagged commit must be reachable from $default_branch."
            exit 1
          fi

  binary:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and package binary
        env:
          BUILD_VERSION: ${{ github.ref_name }}
        run: |
          make build
          package="backup-normalizer-${BUILD_VERSION}-x86_64-unknown-linux-gnu"
          install -Dm755 target/release/backup-normalizer "$package/backup-normalizer"
          install -Dm644 LICENSE "$package/LICENSE"
          install -Dm644 COPYRIGHT "$package/COPYRIGHT"
          install -Dm644 AI_USAGE.md "$package/AI_USAGE.md"
          tar -czf "$package.tar.gz" "$package"
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: backup-normalizer-release
          path: |
            backup-normalizer-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            backup-normalizer-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/backup-normalizer
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: BUILD_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs:
      - binary
      - image
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: backup-normalizer-release
          path: release-assets
      - name: Generate release notes
        shell: bash
        run: |
          previous_tag="$(
            git tag --merged "$GITHUB_SHA" --sort=-version:refname |
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
              grep -Fvx "$GITHUB_REF_NAME" |
              head -n 1 || true
          )"
          range="$GITHUB_SHA"
          if [[ -n "$previous_tag" ]]; then
            range="${previous_tag}..${GITHUB_SHA}"
          fi
          {
            printf '## Commits\n\n'
            git log --format='- %s (%h)' "$range"
          } > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true

